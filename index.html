'use strict';
// =====================================================================
//  KALBİMİN YOLU — Berkant'tan Eylül'üme
// =====================================================================
const W = 256, H = 144, S = 4, T = 16, GY = 112;   // düşük çözünürlük, ölçek, karo, zemin çizgisi

const cv = document.getElementById('c');
cv.width = W * S; cv.height = H * S;
const M = cv.getContext('2d');           // büyük ekran (yazılar)
M.imageSmoothingEnabled = false;

const B = buf.getContext('2d');          // 8-bit dünya

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}

// ---------------------------------------------------------------- yardımcılar
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function seeded(s) { return () => (s = (s * 16807) % 2147483647, (s - 1) / 2147483646); }
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }

    x.fillStyle = mix(cols[k], cols[k + 1], seg - k);
    x.fillRect(cx, cy + Math.floor(i * h / n), w, Math.ceil(h / n) + 1);
  }
}
function disc(x, cx, cy, r, col) {
  x.fillStyle = col;
  for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) if (i * i + j * j <= r * r + r * 0.6) x.fillRect(cx + i, cy + j, 1, 1);

function sprite(rows, pal) {

}

// ---------------------------------------------------------------- karakterler (fotoğraflardan)
// Berkant: kısa koyu saç, sakal, küpe, sarı camlı gözlük, koyu ceket

// kalpler

// ---------------------------------------------------------------- fotoğraflar → pixel art
const PHOTOS = [];
function pixelArt(img) {
  const N = 64, c = mk(N, N), x = c.getContext('2d');
  x.drawImage(img, 0, 0, N, N);
  const d = x.getImageData(0, 0, N, N), p = d.data, pts = [];
  for (let i = 0; i < p.length; i += 4) {
    let r = p[i], g = p[i + 1], b = p[i + 2];
    const l = (r + g + b) / 3;
    r = l + (r - l) * 1.3; g = l + (g - l) * 1.3; b = l + (b - l) * 1.3;   // canlı renkler
    r = (r - 128) * 1.08 + 136; g = (g - 128) * 1.08 + 132; b = (b - 128) * 1.08 + 128;
    pts.push([clamp(r, 0, 255), clamp(g, 0, 255), clamp(b, 0, 255)]);
  }
  // 20 renklik palet (k-means)
  const K = 20, sorted = pts.slice().sort((a, b) => (a[0] + a[1] + a[2]) - (b[0] + b[1] + b[2]));
  let C = []; for (let k = 0; k < K; k++) C.push(sorted[Math.floor((k + 0.5) * sorted.length / K)].slice());
  const lab = new Array(pts.length);
  for (let it = 0; it < 12; it++) {
    const sum = C.map(() => [0, 0, 0, 0]);
    pts.forEach((q, i) => {
      let best = 0, bd = 1e9;
      C.forEach((c, k) => { const dd = (q[0] - c[0]) ** 2 * 0.3 + (q[1] - c[1]) ** 2 * 0.59 + (q[2] - c[2]) ** 2 * 0.11; if (dd < bd) { bd = dd; best = k; } });
      lab[i] = best; const s = sum[best]; s[0] += q[0]; s[1] += q[1]; s[2] += q[2]; s[3]++;
    });
    C = C.map((c, k) => sum[k][3] ? [sum[k][0] / sum[k][3], sum[k][1] / sum[k][3], sum[k][2] / sum[k][3]] : c);
  }
  pts.forEach((q, i) => { const c = C[lab[i]]; p[i * 4] = c[0]; p[i * 4 + 1] = c[1]; p[i * 4 + 2] = c[2]; p[i * 4 + 3] = 255; });
  x.putImageData(d, 0, 0);
  return c;
}
const photosReady = Promise.all((typeof FOTOLAR !== 'undefined' ? FOTOLAR : []).map((src, i) => new Promise(res => {
  const im = new Image();
  im.onload = () => { PHOTOS[i] = pixelArt(im); res(); };
  im.onerror = () => res();
  im.src = src;
})));

// =====================================================================
//  SES — kod içinde üretilen 8-bit müzik ve efektler
// =====================================================================
let AC = null, master, musicG, sfxG, noiseBuf, pulse25, pulse12, muted = false, song = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(AC.destination);
  musicG = AC.createGain(); musicG.gain.value = 0.32; musicG.connect(master);
  sfxG = AC.createGain(); sfxG.gain.value = 0.6; sfxG.connect(master);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  pulse25 = pulseWave(0.25); pulse12 = pulseWave(0.125);
}
function pulseWave(duty) {
  const n = 48, re = new Float32Array(n), im = new Float32Array(n);
  for (let k = 1; k < n; k++) re[k] = 2 / (k * Math.PI) * Math.sin(k * Math.PI * duty);
  return AC.createPeriodicWave(re, im);
}
function freq(n) {
  const m = /^([A-G])(#?)(\d)$/.exec(n);
  const midi = 12 * (+m[3] + 1) + { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] ? 1 : 0);
  return 440 * Math.pow(2, (midi - 69) / 12);
}
function tone(f, t, dur, type, vol, dest, slide) {
  const o = AC.createOscillator(), g = AC.createGain();
  if (type === 'p25') o.setPeriodicWave(pulse25); else if (type === 'p12') o.setPeriodicWave(pulse12); else o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.004);
  g.gain.setValueAtTime(vol, t + dur * 0.6);
  g.gain.linearRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || sfxG);
  o.start(t); o.stop(t + dur + 0.02);

  s.buffer = noiseBuf; f.type = ftype || 'highpass'; f.frequency.value = fq || 6000;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest || sfxG);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
const SFX = {
  jump() { const t = AC.currentTime; tone(240, t, 0.14, 'p25', 0.16, null, 640); },
  heart() { const t = AC.currentTime; tone(988, t, 0.06, 'p25', 0.14); tone(1319, t + 0.06, 0.14, 'p25', 0.14); },
  stomp() { const t = AC.currentTime; tone(520, t, 0.13, 'square', 0.14, null, 110); noise(t, 0.08, 0.2, null, 'bandpass', 1500); },
  hurt() { const t = AC.currentTime; tone(330, t, 0.3, 'sawtooth', 0.14, null, 70); },
  bump() { const t = AC.currentTime; tone(150, t, 0.09, 'triangle', 0.4, null, 90); },
  fall() { const t = AC.currentTime; tone(800, t, 0.7, 'p25', 0.13, null, 90); },
  select() { const t = AC.currentTime; tone(660, t, 0.06, 'p25', 0.14); tone(990, t + 0.07, 0.12, 'p25', 0.14); },
  type() { tone(1400 + Math.random() * 300, AC.currentTime, 0.025, 'p12', 0.035); },
  boom() { const t = AC.currentTime; noise(t, 0.6, 0.18, null, 'lowpass', 900); },
  win() {
    const t = AC.currentTime, n = ['C5', 'E5', 'G5', 'C6', 'E5', 'G5', 'C6', 'E6'];
    n.forEach((x, i) => tone(freq(x), t + i * 0.08, 0.09, 'p25', 0.15));
    tone(freq('G5'), t + 0.7, 0.25, 'p25', 0.15); tone(freq('C6'), t + 0.95, 0.7, 'p25', 0.16);
    tone(freq('C4'), t + 0.7, 0.95, 'triangle', 0.3); tone(freq('E6'), t + 0.95, 0.7, 'p12', 0.06);
  },
};
for (const k in SFX) { const f = SFX[k]; SFX[k] = () => { if (AC) f(); }; }
// şarkılar: her adım bir sekizlik; "." önceki notayı uzatır, "-" sus
const SONGS = {
  tema: { bpm: 138, tracks: [
    { w: 'p25', v: 0.16, n: 'E5 . G5 . C6 . G5 . | A5 . G5 E5 C5 . E5 . | F5 . A5 . C6 . A5 G5 | G5 . . . D5 E5 F5 D5 | E5 . G5 . C6 . D6 . | E6 . D6 C6 A5 . C6 . | D6 . C6 A5 F5 . A5 . | G5 . B5 . C6 . . .' },
    { w: 'triangle', v: 0.32, n: 'C3 - C4 - C3 - C4 - | A2 - A3 - A2 - A3 - | F2 - F3 - F2 - F3 - | G2 - G3 - G2 - G3 -' },
    { w: 'p12', v: 0.05, n: 'C5 E5 G5 E5 C5 E5 G5 E5 | A4 C5 E5 C5 A4 C5 E5 C5 | F4 A4 C5 A4 F4 A4 C5 A4 | G4 B4 D5 B4 G4 B4 D5 B4' },
    { d: 1, n: 'k - h - s - h k' }] },
  gece: { bpm: 104, tracks: [

SONGS.ani = Object.assign({}, SONGS.gece, { bpm: 84 });
// 1. anı: Madonna – La Isla Bonita (8-bit). Her adım bir sekizlik, her ölçü 8 adım.
SONGS.isla = (() => {

    'A4 . . E4 . . A4 .', 'B4 . . E4 . . B4 .', 'C5 . . B4 C5 . . .', '- - - - - - - -',
    '- - - - C5 . . .', 'C5 . . . E5 . . .', 'E5 C5 . C5 . E5 . .', 'D5 . C5 B4 . . . B4',

// 2. bölüm (Gece Terası): Hatırla Sevgili (8-bit). 3/4, her ölçü 6 sekizlik.
SONGS.hatirla = (() => {
  const _ = '- - - - - -', LA = ['- - C5 . C5 .', '- - A4 . A4 .'], GE = ['- - G#4 . G#4 .', '- - E4 . E4 .'], NO = [_, _];
  // [melodi, akor üst sesi, akor alt sesi] — notadaki gibi: uzun tutulan melodi + ayrı çalınan akorlar
  const A = [ // 1–16
    ['A4 . C5 . E5 .'], ['D5 . A4 . C5 .'], ['E5 . . . . .', ...LA], [_, ...LA],
    ['A4 . C5 . E5 .'], ['D5 . A4 . C5 .'], ['B4 . - - - -', ...GE], [_, ...GE],
    ['B4 . C5 . D5 .'], ['D5 . C5 . B4 .'], ['D5 . A4 . D5 .'], ['F5 . A4 . D5 .'],

    ['F5 . A4 . F5 .'], ['E5 . D5 . C5 .'], ['E5 . - - D5 .', '- - C5 . - -', '- - A4 . - -'], ['C5 . B4 . A4 .'],

  const bA = 'A A A E A A E B E E D D E E A A'.split(' ');

function schedule(s) {
  const sp = 60 / s.def.bpm / 2;
  while (s.next < AC.currentTime + 0.15) {
    for (const tr of s.def.tracks) {
      const ev = tr.ev[s.step % tr.ev.length]; if (!ev) continue;
      const t = s.next;
      if (tr.d) {
        if (ev === 'k') { tone(160, t, 0.12, 'sine', 0.5, s.out, 40); }

function buildLevel(i) {

  for (const [a, b] of d.ground) for (let x = a; x < b; x++) { map[7][x] = 1; map[8][x] = 1; }
  for (const [x, top, w] of d.cols || []) for (let k = 0; k < w; k++) for (let y = top; y < 9; y++) map[y][x + k] = 1;
  for (const [x, y, w] of d.bricks || []) for (let k = 0; k < w; k++) map[y][x + k] = 2;
  for (const [x, y] of d.qs || []) map[y][x] = 3;
  for (const [x, y, w] of d.planks || []) for (let k = 0; k < w; k++) map[y][x + k] = 5;
  return {
    i, th, w: d.w, map,
    layers: buildLayers(th, d.w * T),
    hearts: d.hearts.map(([x, y]) => ({ x: x * T + 8, y: y * T + 8, taken: false, p: Math.random() * 60 })),

const tile = (tx, ty) => (tx < 0 || tx >= L.w) ? 1 : (ty < 0 || ty > 8) ? 0 : L.map[ty][tx];
const solid = t => t >= 1 && t <= 4;

function moveX(o, dx) {
  o.x += dx;
  const ys = [o.y + 1, o.y + o.h / 2, o.y + o.h - 1];
  if (dx > 0) { const tx = Math.floor((o.x + o.w) / T); if (ys.some(y => solid(tile(tx, Math.floor(y / T))))) { o.x = tx * T - o.w; o.vx = 0; return true; } }
  else if (dx < 0) { const tx = Math.floor(o.x / T); if (ys.some(y => solid(tile(tx, Math.floor(y / T))))) { o.x = (tx + 1) * T; o.vx = 0; return true; } }
  return false;
}
function moveY(o, isPlayer) {
  const prevB = o.y + o.h; o.y += o.vy; o.ground = false;
  if (o.vy > 0) {
    const ty = Math.floor((o.y + o.h) / T);
    for (const fx of [o.x + 1, o.x + o.w - 1]) {
      const t = tile(Math.floor(fx / T), ty);
      if (solid(t) || (t === 5 && prevB <= ty * T + 0.5)) { o.y = ty * T - o.h; o.vy = 0; o.ground = true; break; }
    }
  } else if (o.vy < 0) {
    const ty = Math.floor(o.y / T);
    for (const fx of [o.x + o.w / 2, o.x + 1, o.x + o.w - 1]) {
      const tx = Math.floor(fx / T);
      if (solid(tile(tx, ty))) { o.y = (ty + 1) * T; o.vy = 0; if (isPlayer) hitBlock(tx, ty); break; }
    }
  }
}
function hitBlock(tx, ty) {
  const t = L.map[ty] && L.map[ty][tx];
  L.bumps.push({ tx, ty, t: 8 });
  if (t === 3) {
    L.map[ty][tx] = 4; L.got++; totalHearts++; SFX.heart();
    particles.push({ kind: 'bigheart', x: tx * T + 4, y: ty * T - 8, vx: 0, vy: -2.2, g: 0.12, life: 34 });
    for (let i = 0; i < 6; i++) spark(tx * T + 8, ty * T, '#ffd27a');
  } else SFX.bump();
}
function spark(x, y, col, n = 1, space = 'w') {

}
function heartBurst(x, y, n, space = 'w', sp = 1.6) {

  }
}

function updatePlay() {
  // hareketli platformlar
  for (const m of L.movers) { m.ph += m.sp; const nx = m.a + (m.b - m.a) * (0.5 - 0.5 * Math.cos(m.ph)); m.dx = nx - m.x; m.x = nx; }
  const control = state === 'play';
  if (P.plat) moveX(P, P.plat.dx);

  let ax = 0;
  if (control) { if (keys.left) ax -= 1; if (keys.right) ax += 1; }
  else { ax = P.x < L.goal.x - 15 ? 1 : 0; }
  if (ax) { P.vx += ax * (P.ground ? 0.16 : 0.12); P.face = ax; }
  else P.vx *= P.ground ? 0.72 : 0.95;
  if (Math.abs(P.vx) < 0.05) P.vx = 0;
  P.vx = clamp(P.vx, -1.35, control ? 1.35 : 0.9);

  P.jbuf = control && pressed.jump ? 7 : P.jbuf - 1;
  P.coyote = P.ground ? 6 : P.coyote - 1;
  if (P.jbuf > 0 && P.coyote > 0) {
    P.vy = -5; P.jbuf = 0; P.coyote = 0; SFX.jump();
    for (let i = 0; i < 4; i++) particles.push({ kind: 'dust', x: P.x + 5, y: P.y + P.h, vx: rnd(-0.8, 0.8), vy: rnd(-0.5, 0), g: 0, life: 14 });
  }
  if (!keys.jump && P.vy < -1.8 && control) P.vy = -1.8;
  P.vy = Math.min(P.vy + 0.23, 4.5);

  moveX(P, P.vx);
  P.prevB = P.y + P.h;
  moveY(P, true);
  P.plat = null;
  if (!P.ground && P.vy >= 0) for (const m of L.movers) {
    if (P.x + P.w > m.x && P.x < m.x + m.w && P.prevB <= m.y + 0.5 && P.y + P.h >= m.y) { P.y = m.y - P.h; P.vy = 0; P.ground = true; P.plat = m; break; }
  }
  if (P.ground && !P.plat && solid(tile(Math.floor((P.x + 1) / T), Math.floor((P.y + P.h + 1) / T))) && solid(tile(Math.floor((P.x + P.w - 1) / T), Math.floor((P.y + P.h + 1) / T))))
    safe = { x: P.x, y: P.y };
  P.anim += Math.abs(P.vx);
  if (P.inv > 0) P.inv--;

  // düşme
  if (P.y > H + 30) {
    SFX.fall(); cam.shake = 10;
    Object.assign(P, { x: safe.x, y: safe.y - 2, vx: 0, vy: 0, inv: 90 });
  }

  // kalpler
  for (const h of L.hearts) {
    if (h.taken) continue;
    if (Math.abs(P.x + P.w / 2 - h.x) < 11 && Math.abs(P.y + P.h / 2 - h.y) < 12) {
      h.taken = true; L.got++; totalHearts++; SFX.heart();
      heartBurst(h.x, h.y, 5, 'w', 1);
    }
  }
  // düşmanlar
  for (const e of L.enemies) {
    if (e.dead) { e.dead++; continue; }
    if (Math.abs(e.x - P.x) < W * 1.5) {
      const ahead = e.vx < 0 ? e.x - 1 : e.x + e.w + 1;
      if (solid(tile(Math.floor(ahead / T), Math.floor((e.y + 4) / T))) || !solid(tile(Math.floor(ahead / T), Math.floor((e.y + e.h + 2) / T)))) e.vx = -e.vx;
      e.x += e.vx;
    }
    if (!control) continue;
    if (P.x < e.x + e.w && P.x + P.w > e.x && P.y < e.y + e.h && P.y + P.h > e.y) {
      if (P.vy > 0 && P.y + P.h - e.y < 7) {
        e.dead = 1; P.vy = -4; SFX.stomp(); L.got++; totalHearts++;
        heartBurst(e.x + 6, e.y, 8, 'w', 1.4);
      } else hurt(e.x + e.w / 2);
    }
  }
  L.enemies = L.enemies.filter(e => e.dead < 24);
  // dikenler
  if (control) for (const t of L.thorns) {
    if (P.x < t.x + 14 && P.x + P.w > t.x + 2 && P.y + P.h > t.y + 4 && P.y < t.y + 10) hurt(t.x + 8);
  }
  for (const b of L.bumps) b.t--;
  L.bumps = L.bumps.filter(b => b.t > 0);

  // kamera
  const target = clamp(P.x + P.w / 2 - W / 2 + P.face * 18, 0, L.w * T - W);
  cam.x += (target - cam.x) * 0.1;
  if (cam.shake > 0) cam.shake--;

  // hedef: Eylül
  if (control && P.x + P.w >= L.goal.x - 18) { go('win'); winT = 0; stopSong(); SFX.win(); P.vx = Math.min(P.vx, 1); }
}
function hurt(fromX) {
  if (P.inv > 0) return;
  SFX.hurt(); cam.shake = 8; P.inv = 90;
  P.vx = P.x + P.w / 2 < fromX ? -1.8 : 1.8; P.vy = -3;
  if (totalHearts > 0 && L.got > 0) {
    totalHearts--; L.got--;
    particles.push({ kind: 'broken', x: P.x + 2, y: P.y - 6, vx: 0, vy: -1.2, g: 0.04, life: 40 });
  }
}

function update() {
  tGlobal++; st++;
  const ok = confirmPressed();
  switch (state) {
    case 'intro':
      if (st % 10 === 0) particles.push({ kind: 'mini', col: Object.keys(MINI)[Math.random() * 6 | 0], x: Math.random() * W, y: H + 6, vx: 0, vy: -rnd(0.3, 0.7), g: 0, life: 400, space: 's', wob: Math.random() * 6 });
      if (ok && st > 10) { initAudio(); SFX.select(); playSong('baslik'); particles = []; go('title'); }
      break;
    case 'title':
      if (st % 30 === 0) heartBurst(W / 2, 92, 3, 's', 0.8);
      if (ok && st > 15) { SFX.select(); totalHearts = 0; startLevelIntro(0); }
      break;
    case 'lvlIntro':
      if (st > 170 || (ok && st > 25)) startLevel(levelIdx);
      break;
    case 'play':
      updatePlay();
      break;
    case 'win':
      updatePlay(); winT++;
      if (winT % 6 === 0) heartBurst(L.goal.x - 4, L.goal.y, 2, 'w', 1.2);
      if (winT === 40 || winT === 90) heartBurst(L.goal.x - 4, L.goal.y - 6, 20, 'w', 2.2);
      if (winT > 180) { particles = []; playSong(['isla', 'sonarzum', 'yildiz'][levelIdx]); go('memory'); }
      break;
    case 'memory': {
      if (st % 14 === 0) particles.push({ kind: 'mini', col: '#ff8fab', x: Math.random() * W, y: H + 6, vx: 0, vy: -rnd(0.2, 0.5), g: 0, life: 500, space: 's', wob: Math.random() * 6 });
      const total = CAPTIONS[levelIdx].join('').length, shown = Math.floor((st - 40) / 3);
      if (shown > 0 && shown <= total && st % 3 === 0 && CAPTIONS[levelIdx].join('')[shown - 1] !== ' ') SFX.type();
      if (ok && st > 30) {
        if (shown < total) st = 40 + total * 3 + 1;
        else { SFX.select(); particles = []; if (levelIdx < 2) startLevelIntro(levelIdx + 1); else { playSong('final'); go('final'); } }
      }
      break;
    }
    case 'final': {
      if (st % 45 === 1) {
        particles.push({ kind: 'rocket', x: rnd(30, W - 30), y: H, vx: rnd(-0.3, 0.3), vy: -rnd(2.6, 3.4), g: 0.045, life: 999, space: 's', col: ['#ff4d6d', '#ffd27a', '#7ad7ff', '#c77dff', '#ff8fab', '#b6ff9e'][Math.random() * 6 | 0] });
      }
      const fl = finalLines(), total = fl.join('').length, shown = Math.floor((st - 60) / 3);
      if (shown > 0 && shown <= total && st % 3 === 0) SFX.type();
      if (ok && st > 30) {
        if (shown < total + 10) st = 60 + (total + 10) * 3;
        else { SFX.select(); particles = []; playSong('baslik'); go('title'); }
      }
      break;
    }
  }
  // parçacıklar
  for (const p of particles) {
    p.x += p.vx + (p.wob !== undefined ? Math.sin((tGlobal + p.wob * 20) / 25) * 0.25 : 0);
    p.y += p.vy; p.vy += p.g || 0; p.life--;
    if (p.kind === 'rocket' && p.vy >= -0.2) {
      p.life = 0; if (AC) SFX.boom();
      const heartShape = Math.random() < 0.5;
      for (let i = 0; i < 36; i++) {
        const a = i / 36 * Math.PI * 2;
        let vx = Math.cos(a), vy = Math.sin(a);
        if (heartShape) { // kalp şeklinde patlama
          const tt = a; vx = 16 * Math.sin(tt) ** 3 / 16; vy = -(13 * Math.cos(tt) - 5 * Math.cos(2 * tt) - 2 * Math.cos(3 * tt) - Math.cos(4 * tt)) / 16;
        }
        particles.push({ kind: 'dot', x: p.x, y: p.y, vx: vx * 1.3, vy: vy * 1.3, g: 0.015, life: 70 + (Math.random() * 20 | 0), col: p.col, space: 's', fade: 1 });
      }
    }
  }
  particles = particles.filter(p => p.life > 0 && p.y < H + 40 && p.y > -60);
}

// =====================================================================
//  ÇİZİM
// =====================================================================
function txt(s, x, y, size = 16, col = '#fff', align = 'center', shadow = '#000') {
  M.font = size + 'px ' + FONT; M.textAlign = align; M.textBaseline = 'top';
  if (shadow) { M.fillStyle = shadow; M.fillText(s, x + Math.max(2, size / 8), y + Math.max(2, size / 8)); }
  M.fillStyle = col; M.fillText(s, x, y);
  return M.measureText(s).width;
}
function big(spr, x, y, sc) { M.drawImage(spr, Math.round(x), Math.round(y), spr.width * sc, spr.height * sc); }
function drawParticles(space, camX) {
  for (const p of particles) {
    if ((p.space || 'w') !== space) continue;
    const x = Math.round(p.x - (space === 'w' ? camX : 0)), y = Math.round(p.y);
    if (p.life < 14 && (p.life & 2)) continue;
    if (p.kind === 'mini') B.drawImage(MINI[p.col], x - 2, y - 2);
    else if (p.kind === 'bigheart') B.drawImage(HEART, x, y);
    else if (p.kind === 'broken') { B.drawImage(HEART_D, x, y); B.fillStyle = '#1a0f24'; B.fillRect(x + 3, y + 1, 1, 4); }
    else if (p.kind === 'dust') { B.fillStyle = '#e8dccc'; B.fillRect(x, y, 2, 2); }
    else if (p.kind === 'rocket') { B.fillStyle = '#fff'; B.fillRect(x, y, 1, 2); B.fillStyle = p.col; B.fillRect(x, y + 2, 1, 2); }
    else { B.fillStyle = p.col; B.fillRect(x, y, p.fade ? 2 : 1, p.fade ? 2 : 1); }
  }
}
function drawWorld() {
  const th = L.th, lay = L.layers;
  let cx = Math.round(cam.x);
  if (cam.shake) cx += (Math.random() * 4 - 2) | 0;
  B.drawImage(lay.sky, 0, 0);
  if (L.i === 1) th.dyn(cx, tGlobal);           // yıldızlar arkada
  B.drawImage(lay.far, -Math.round(cx * 0.25), 0);
  B.drawImage(lay.near, -Math.round(cx * 0.5), 0);
  if (L.i === 2) th.dyn(cx, tGlobal);

  // karolar
  const x0 = Math.floor(cx / T), x1 = x0 + W / T + 1;
  for (let tx = x0; tx <= x1; tx++) {           // boşluklar: aşağısı karanlık
    if (tx < 0 || tx >= L.w || L.map[8][tx]) continue;
    B.fillStyle = 'rgba(12,6,22,.45)'; B.fillRect(tx * T - cx, GY + 2, T, H);
    B.fillStyle = 'rgba(12,6,22,.75)'; B.fillRect(tx * T - cx, GY + 14, T, H);
  }
  for (let ty = 0; ty < 9; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (tx < 0 || tx >= L.w) continue;
    const t = L.map[ty][tx]; if (!t) continue;
    let px = tx * T - cx, py = ty * T;
    const bump = L.bumps.find(b => b.tx === tx && b.ty === ty);
    if (bump) py -= Math.round(Math.sin(bump.t / 8 * Math.PI) * 4);
    let img;
    if (t === 1) img = (ty === 0 || L.map[ty - 1][tx] !== 1) ? th.top : th.fill;
    else if (t === 2) img = th.brick;
    else if (t === 3) img = (tGlobal >> 4) % 4 === 0 ? Q2 : Q1;
    else if (t === 4) img = USED;
    else img = th.plank;
    B.drawImage(img, px, py);
  }
  for (const m of L.movers) for (let k = 0; k < m.w; k += T) B.drawImage(th.plank, Math.round(m.x) - cx + k, m.y);
  for (const t of L.thorns) B.drawImage(THORN, t.x - cx, t.y);

  // kalpler
  for (const h of L.hearts) if (!h.taken) {
    const bob = Math.round(Math.sin((tGlobal + h.p) / 10) * 1.5);
    B.drawImage(HEART, h.x - 3 - cx, h.y - 3 + bob);
  }
  // düşmanlar
  for (const e of L.enemies) {
    const img = CLOUD[(tGlobal >> 3) & 1];
    if (e.dead) B.drawImage(img, 0, 0, 14, 9, Math.round(e.x) - 1 - cx, e.y + 5, 14, 4);
    else B.drawImage(img, Math.round(e.x) - 1 - cx, e.y);
  }
  // Eylül
  const g = L.goal, near = Math.abs(P.x - g.x) < 70;
  let ey = g.y, eImg = (tGlobal % 200) < 8 ? EYL.blink : EYL.idle;
  if (state === 'win' || near) { const ph = (tGlobal % 30) / 30; if (ph < 0.4) { ey -= Math.round(Math.sin(ph / 0.4 * Math.PI) * 6); eImg = EYL.jump; } }
  B.drawImage(eImg, g.x - cx, ey);
  const hb = Math.round(Math.sin(tGlobal / 12) * 2);
  B.drawImage(HEART, 0, 0, 7, 6, g.x - cx - 1, g.y - 24 + hb, 14, 12);

  // Berkant
  if (!(P.inv > 0 && (P.inv >> 2) & 1)) {
    let k;
    if (state === 'win' && P.vx === 0) { const ph = (winT % 30) / 30; k = ph < 0.4 && winT > 30 ? 'jump' : 'idle'; }
    else if (!P.ground) k = 'jump';
    else if (Math.abs(P.vx) > 0.3) k = (P.anim / 10 | 0) % 2 ? 'run1' : 'run2';
    else k = (tGlobal % 180) < 7 ? 'blink' : 'idle';
    let py = Math.round(P.y) - 1;
    if (state === 'win' && k === 'jump' && P.ground) py -= Math.round(Math.sin(((winT % 30) / 30) / 0.4 * Math.PI) * 6);
    B.drawImage((P.face < 0 ? BERK_L : BERK)[k], Math.round(P.x) - 1 - cx, py);
  }
  drawParticles('w', cx);
  return cx;
}
function polaroid(i, cx, cy, sc, rot) {
  const ph = 64 * sc, pad = Math.round(sc * 3.5), fw = ph + pad * 2, fh = ph + pad * 5;
  M.save(); M.translate(cx, cy); M.rotate(rot);
  M.fillStyle = 'rgba(0,0,0,.35)'; M.fillRect(-fw / 2 + 8, -fh / 2 + 8, fw, fh);
  M.fillStyle = '#f6f0e4'; M.fillRect(-fw / 2, -fh / 2, fw, fh);
  if (PHOTOS[i]) M.drawImage(PHOTOS[i], -ph / 2, -fh / 2 + pad, ph, ph);
  M.drawImage(HEART, 0, 0, 7, 6, -sc * 3.5, fh / 2 - pad * 2.6, sc * 7, sc * 6);
  M.fillStyle = 'rgba(255,170,200,.75)'; M.fillRect(-fw * 0.18, -fh / 2 - 10, fw * 0.36, 22);
  M.restore();
}
function finalLines() {
  return ['25 Mart 2026\'dan beri', 'tam ' + daysTogether() + ' gündür', 'kalbimin yolu hep sana çıkıyor.'];
}
function typed(lines, n) { const out = []; for (const l of lines) { out.push(l.slice(0, Math.max(0, n))); n -= l.length; } return out; }

function render() {
  M.clearRect(0, 0, cv.width, cv.height);
  const blink = (tGlobal >> 5) & 1;
  switch (state) {
    case 'loading':
      B.fillStyle = '#1a0f24'; B.fillRect(0, 0, W, H); M.drawImage(buf, 0, 0, W * S, H * S);
      txt('Yükleniyor...', 512, 280, 16, '#ff8fab');
      break;
    case 'intro': {
      B.fillStyle = '#1a0f24'; B.fillRect(0, 0, W, H);
      drawParticles('s', 0);
      M.drawImage(buf, 0, 0, W * S, H * S);
      const s1 = 'Eylül\'üm için yapıldı';
      M.font = '24px ' + FONT; const w1 = M.measureText(s1).width;
      txt(s1, 512 - 24, 210, 24, '#fff');
      big(HEART, 512 - 24 + w1 / 2 + 14, 206, 4);
      txt('Berkant\'tan sevgiyle', 512, 280, 16, '#ff8fab');
      if (blink) txt('[ ENTER / DOKUN ]', 512, 420, 16, '#ffd27a');
      break;
    }
    case 'title': {
      const th = THEMES[0];
      if (!TITLE_BG) TITLE_BG = buildLayers(th, W * 6);
      const off = (Math.sin(tGlobal / 600) * 0.5 + 0.5) * W * 2;
      B.drawImage(TITLE_BG.sky, 0, 0);
      B.drawImage(TITLE_BG.far, -Math.round(off * 0.25), 0);
      B.drawImage(TITLE_BG.near, -Math.round(off * 0.5), 0);
      for (let x = 0; x < W; x += T) { B.drawImage(th.top, x, GY); B.drawImage(th.fill, x, GY + T); }
      B.fillStyle = 'rgba(26,15,36,.25)'; B.fillRect(0, 0, W, H);
      drawParticles('s', 0);
      M.drawImage(buf, 0, 0, W * S, H * S);
      txt('KALBİMİN YOLU', 512, 70, 40, '#ff4d6d', 'center', '#3a0a1a');
      txt('Berkant & Eylül\'üm',512, 138, 16, '#fff');
      const bob = Math.round(Math.sin(tGlobal / 8)) * 4;
      big((tGlobal % 180) < 7 ? BERK.blink : BERK.idle, 330, GY * S - 16 * 6 * 1 - 0, 6);
      big((tGlobal % 200) < 8 ? EYL.blink : EYL.idle, 622, GY * S - 16 * 6, 6);
      const pulse = 4 + ((tGlobal >> 4) & 1);
      big(HEART, 512 - 3.5 * pulse, 300 + bob, pulse);
      txt('25.03.2026\'dan beri ' + daysTogether() + ' gün', 512, 186, 16, '#ffd27a');
      if (blink) txt('BAŞLA: ENTER / DOKUN', 512, 512, 16, '#fff');
      txt('Yön tuşları: yürü   Boşluk: zıpla   M: ses', 512, 546, 12, '#ffe2c0', 'center', '#000');
      txt('Müzik: Fikrimin İnce Gülü - Muallim İsmail Hakkı Bey (8-bit)', 512, 564, 8, '#ffe2c0', 'center', '#000');
      break;
    }
    case 'lvlIntro': {
      B.fillStyle = '#0d0814'; B.fillRect(0, 0, W, H);
      M.drawImage(buf, 0, 0, W * S, H * S);
      txt('BÖLÜM ' + (levelIdx + 1), 512, 150, 32, '#ff4d6d');
      txt(THEMES[levelIdx].name, 512, 220, 16, '#ffd27a');
      const run = (tGlobal >> 3) & 1 ? BERK.run1 : BERK.run2;
      big(run, 400, 300, 5);
      big(HEART, 495, 330 + Math.round(Math.sin(tGlobal / 6) * 6), 3);
      big(EYL.idle, 560, 300, 5);
      txt('Eylül\'üme ulaş, kalpleri topla!', 512, 440, 12, '#fff');
      const lvCredit = ['Müzik: Sen Benim Şarkılarımsın (8-bit)', 'Müzik: Hatırla Sevgili (8-bit)', 'Müzik: Cem Kısmet - Eylül Akşamı (8-bit)'][levelIdx];
      if (lvCredit) txt(lvCredit, 512, 540, 8, '#c8a8d8', 'center', '#000');
      break;
    }
    case 'play': case 'win': {
      const cx = drawWorld();
      M.drawImage(buf, 0, 0, W * S, H * S);
      // Eylül etiketi
      const lx = (L.goal.x - cx + 6) * S;
      if (lx > -100 && lx < cv.width + 100) txt('Eylül\'üm', lx, (L.goal.y - 38) * S, 12, '#fff');
      // HUD
      txt(L.th.name, 20, 18, 12, '#fff', 'left');
      big(HEART, 860, 12, 4);
      txt('x ' + totalHearts, 900, 18, 16, '#fff', 'left');
      if (state === 'play' && levelIdx === 0 && st < 300) txt('Eylül\'üme giden yolu bul!  ->', 512, 70, 12, '#ffd27a');
      if (state === 'win' && winT > 40) {
        const msg = ['Buldum seni!', 'Yine sana çıktı yolum!', 'Kalbim hep burada!'][levelIdx];
        txt(msg, 512, 150, 24, '#ff4d6d', 'center', '#fff');
      }
      break;
    }
    case 'memory': {
      B.fillStyle = '#1a0f24'; B.fillRect(0, 0, W, H);
      drawParticles('s', 0);
      M.drawImage(buf, 0, 0, W * S, H * S);
      const slide = Math.min(1, st / 30), ease = 1 - (1 - slide) ** 3;
      polaroid(levelIdx, 290, 290 + (1 - ease) * 400, 5, -0.05);
      txt('ANI ' + (levelIdx + 1) + '/3', 560, 90, 24, '#ff4d6d', 'left');
      txt(THEMES[levelIdx].name, 560, 136, 12, '#ffd27a', 'left');
      const lines = typed(CAPTIONS[levelIdx], Math.floor((st - 40) / 3));
      lines.forEach((l, i) => txt(l, 560, 200 + i * 40, 16, '#fff', 'left'));
      txt('Toplanan kalp: ' + L.got, 560, 400, 12, '#ff8fab', 'left');
      const credit = ['Müzik: Madonna - La Isla Bonita (8-bit)', 'Müzik: Nilüfer - Son Arzum (8-bit)', 'Müzik: Yıldızların Altında - Kaptanzâde Ali Rıza Bey (8-bit)'][levelIdx];
      if (credit) txt(credit, 512, 550, 8, '#c8a8d8', 'center', '#000');
      if (Math.floor((st - 40) / 3) >= CAPTIONS[levelIdx].join('').length && blink) txt('ENTER: devam', 560, 500, 12, '#ffd27a', 'left');
      break;
    }
    case 'final': {
      bands(B, 0, 0, W, H, ['#0a0d2b', '#2a1a4e', '#5a2a5e'], 12);
      for (const s of STARS) if ((tGlobal + s.p) % 90 < 70) { B.fillStyle = s.c; B.fillRect(s.x | 0, s.y, 1, 1); }
      drawParticles('s', 0);
      M.drawImage(buf, 0, 0, W * S, H * S);
      polaroid(0, 130, 170, 2, -0.1);
      polaroid(2, 140, 410, 2, 0.08);
      polaroid(1, 894, 280, 2.2, 0.09);
      const fl = finalLines(), n = Math.floor((st - 60) / 3);
      typed(fl, n).forEach((l, i) => txt(l, 512, 70 + i * 36, 16, '#fff'));
      const tot = fl.join('').length;
      if (n > tot) {
        const s1 = 'SENİ SEVİYORUM EYLÜL\'ÜM';
        txt(s1, 512, 210, 24, '#ff4d6d', 'center', '#fff');
        txt('- Berkant', 512, 256, 12, '#ffd27a');
      }
      const bob = Math.round(Math.sin(tGlobal / 8) * 4);
      big(BERK.idle, 410, 330, 6);
      big(EYL.idle, 542, 330, 6);
      big(HEART, 512 - 14, 300 + bob, 4);
      if (n > tot + 10) {
        txt('Toplanan kalp: ' + totalHearts + '  (ama benimki zaten senin)', 512, 466, 12, '#ffe2c0');
        if (blink) txt('ENTER: baştan oyna', 512, 510, 12, '#ffd27a');
        txt('Müzik: Pilli Bebek - Bak (8-bit intro)', 512, 550, 8, '#c8a8d8', 'center', '#000');
      }
      break;
    }
  }
}
let TITLE_BG = null;

// =====================================================================
//  DÖNGÜ
// =====================================================================
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(now - last, 100); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; for (const k in pressed) delete pressed[k]; }
  render();
  requestAnimationFrame(frame);
}
const fontReady = document.fonts ? Promise.race([document.fonts.load('16px "Press Start 2P"'), new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
Promise.all([photosReady, fontReady]).then(() => go('intro'));
requestAnimationFrame(frame);
</script>
